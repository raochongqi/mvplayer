name: ci

on:
  push:
    branches: [main, "task/**"]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: linux tests + mpv build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: system deps (libmpv + X11/GL headers)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libmpv-dev libgl1-mesa-dev xorg-dev libegl1 libxkbcommon-x11-0 ffmpeg

      - name: vet
        run: go vet ./... && go vet -tags mpv ./...

      - name: unit tests (stub engine)
        run: go test ./...

      - name: generate test media (ffmpeg)
        run: |
          mkdir -p /tmp/media
          ffmpeg -y -f lavfi -i testsrc=size=640x360:rate=30 \
                 -f lavfi -i sine=frequency=440 -t 10 \
                 -c:v libx264 -pix_fmt yuv420p -c:a aac /tmp/media/sample.mkv
          ls -lh /tmp/media/sample.mkv

      - name: unit tests (real libmpv)
        env:
          MVPLAYER_SAMPLE: /tmp/media/sample.mkv
        run: go test -tags mpv ./...

      - name: build (libmpv)
        run: |
          go build -tags mpv -o build/mvplayer ./cmd/mvplayer
          ldd build/mvplayer | grep -i mpv

      - uses: actions/upload-artifact@v4
        with:
          name: mvplayer-linux（需系统 libmpv2）
          path: build/mvplayer

  windows-package:
    name: windows package (exe + libmpv + installer)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: mingw + nsis + 7zip
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-mingw-w64-x86-64 nsis p7zip-full curl

      - name: fetch official libmpv (not committed)
        run: make fetch-libmpv

      - name: build exe + installer
        run: |
          make package-windows
          makensis packaging/windows/installer.nsi
          ls -lh build/mvplayer.exe build/libmpv-2.dll build/mvPlayer-0.1.0-setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: mvplayer-windows
          path: |
            build/mvPlayer-0.1.0-setup.exe
            build/mvplayer.exe
            build/libmpv-2.dll
          if-no-files-found: error
