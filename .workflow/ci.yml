# Gitee Go 流水线：自定义镜像跑 vet + 两套测试 + mpv 构建。
#
# 注意 Gitee Go 的 stage 写法是「- stage:」空键，name/displayName/steps 与它同级，
# 不能缩进到 stage: 下面（那样会报 stages[0].steps 缺失）。
#
# 需要先在流水线变量里配置：
#   REGISTRY_REPOSITORY  镜像仓库地址，如 registry.cn-hangzhou.aliyuncs.com/your-ns
#   REGISTRY_USER        仓库用户名
#   REGISTRY_PASSWORD    仓库密码/访问令牌
# 没有镜像仓库时可本地验证：docker build -f packaging/ci/Dockerfile -t mvplayer-ci .

version: '1.0'
name: ci
displayName: CI（自定义镜像）

# 构建慢/超时：任务超时放宽到 90 分钟（上限 1440）
strategy:
  blocking: false
  stepTimeout: 90

stages:
  - stage:
    name: test
    displayName: 测试与构建
    strategy: naturally
    trigger: auto
    steps:
      - step: build@docker
        name: docker_ci
        displayName: 构建镜像并运行测试
        repository: ${REGISTRY_REPOSITORY}
        username: ${REGISTRY_USER}
        password: ${REGISTRY_PASSWORD}
        tag: mvplayer-ci:${GITEE_PIPELINE_BUILD_NUMBER}
        dockerfile: ./packaging/ci/Dockerfile
        isCache: true

triggers:
  push:
    branches:
      include:
        - main
