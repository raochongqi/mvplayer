# Gitee Go 流水线（文档核对过的结构）
#   - 顶层：version / name / displayName / variables / strategy / stages / triggers
#   - stages 列表项：`- stage:` 空键，name/displayName/strategy/trigger/steps 与它同级
#   - 自定义参数必须先在 variables: 里声明，才能用 ${XXX} 引用，
#     否则会报 "failed to resolve - invalid inference format"
#
# 使用前把下面三个 CHANGE_ME 换成你的镜像仓库信息（或在流水线「参数设置」里定义同名变量）：
#   REGISTRY_REPOSITORY  例：registry.cn-hangzhou.aliyuncs.com/your-namespace
#   REGISTRY_USER
#   REGISTRY_PASSWORD

version: '1.0'
name: ci
displayName: CI（自定义镜像）

variables:
  REGISTRY_REPOSITORY: registry.cn-hangzhou.aliyuncs.com/CHANGE_ME
  REGISTRY_USER: CHANGE_ME
  REGISTRY_PASSWORD: CHANGE_ME

strategy:
  blocking: false
  stepTimeout: 90

stages:
  - stage:
    name: test
    displayName: 测试与构建
    strategy: naturally
    trigger: auto
    steps:
      - step: build@docker
        name: docker_ci
        displayName: 构建镜像并运行测试
        repository: ${REGISTRY_REPOSITORY}
        username: ${REGISTRY_USER}
        password: ${REGISTRY_PASSWORD}
        tag: mvplayer-ci:${GITEE_PIPELINE_BUILD_NUMBER}
        dockerfile: ./packaging/ci/Dockerfile
        isCache: true

triggers:
  push:
    branches:
      include:
        - main
